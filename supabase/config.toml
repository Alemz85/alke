project_id = "your-project-ref"

# Auth is our own x-ingest-token shared secret; Health Auto Export cannot
# send a Supabase JWT, so gateway JWT verification must stay off.
[functions.ingest]
verify_jwt = false

# Phone gym card: auth is the GYMCARD_TOKEN capability key in the URL — a
# plain browser bookmark cannot send a Supabase JWT either.
[functions.gymcard]
verify_jwt = false
