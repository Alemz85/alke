name: nightly-metrics

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      skip_insights:
        description: 'Skip the insight finders (fast on-demand recompute)'
        type: boolean
        default: false

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r metrics/requirements.txt
      - run: python -m metrics.compute ${{ inputs.skip_insights == true && '--skip-insights' || '' }}
        env:
          # Stage prints flush as they happen, so run logs carry real timings.
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
